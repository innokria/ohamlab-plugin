[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohamlab-agent"
version = "0.1.1"
description = "Web research and extraction toolkit with MCP and optional autonomous LLM agents"
readme = "README.md"
requires-python = ">=3.11"
[project.scripts]
ohamlab = "ohamlab_cli:app"

[tool.setuptools]
py-modules = ["ohamlab_cli"]
packages = ["agent", "browser", "storage", "mcp_server", "mcp_server.tools"]
